<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galería ASIC · José María Sigüenza Izquierdo</title>
  <meta name="description"
    content="Galería de imágenes de circuitos integrados ASIC: diseños, layouts y capturas.">
  <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
  <link rel="icon" type="image/x-icon" href="favicon.ico" sizes="32x32">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
  <meta name="theme-color" content="#16171B">

  <script>
    // Fija el tema (oscuro/claro) antes de pintar, para que no haya parpadeo al cargar.
    (function () {
      try {
        var saved = localStorage.getItem('theme');
        // Por defecto, oscuro: solo marcamos 'light' si el usuario lo eligió.
        if (saved === 'light') document.documentElement.setAttribute('data-theme', 'light');
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', saved === 'light' ? '#FBFAF7' : '#16171B');
      } catch (e) {}
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet">

  <style>
    /* El modo oscuro es el de por defecto (también sin JS). */
    :root {
      --bg: #16171B;
      --surface: #1F2127;
      --ink: #F2EFE8;
      --text: #C2C5CC;
      --muted: #868B95;
      --line: #2C2F37;
      --accent: #C8A26C;
      --accent-ink: #D8B888;
      --radius: 16px;
      --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 18px 50px rgba(0, 0, 0, .5);
      --maxw: 1240px;
    }

    /* Modo claro: opcional, se activa con data-theme="light". */
    [data-theme="light"] {
      --bg: #FBFAF7;
      --surface: #FFFFFF;
      --ink: #17181B;
      --text: #4A4D54;
      --muted: #9A9EA6;
      --line: #ECE8DF;
      --accent: #B08D57;
      --accent-ink: #8A6D3F;
      --shadow: 0 1px 2px rgba(23, 24, 27, .04), 0 18px 50px rgba(23, 24, 27, .07);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      background-image: radial-gradient(var(--line) 1px, transparent 1px);
      background-size: 26px 26px;
      transition: background-color .3s ease, color .3s ease;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .wrap {
      width: 100%;
      max-width: var(--maxw);
      margin: 0 auto;
      padding: 0 24px;
    }

    /* ---------- Top bar ---------- */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 24px 0;
    }

    .back {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: .94rem;
      font-weight: 600;
      color: var(--text);
      transition: color .18s ease, transform .18s ease;
    }

    .back:hover {
      color: var(--ink);
      transform: translateX(-2px);
    }

    .back svg {
      width: 16px;
      height: 16px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 1px solid var(--line);
      background: var(--surface);
      box-shadow: var(--shadow);
      font-family: 'Fraunces', serif;
      font-size: 1.25rem;
      font-weight: 600;
      color: var(--ink);
      transition: transform .18s ease, border-color .18s ease;
    }

    .brand:hover {
      transform: translateY(-2px);
      border-color: var(--ink);
    }

    .brand span {
      color: var(--accent);
    }

    /* Acciones a la derecha de la barra: botón de tema + monograma. */
    .topbar-actions {
      display: inline-flex;
      align-items: center;
      gap: 14px;
    }

    .theme-toggle {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 1px solid var(--line);
      background: var(--surface);
      box-shadow: var(--shadow);
      color: var(--ink);
      cursor: pointer;
      transition: transform .18s ease, border-color .18s ease, background-color .3s ease, color .3s ease;
    }

    .theme-toggle:hover {
      transform: translateY(-2px);
      border-color: var(--ink);
    }

    .theme-toggle svg {
      width: 20px;
      height: 20px;
    }

    .theme-toggle .icon-moon { display: none; }
    [data-theme="light"] .theme-toggle .icon-sun { display: none; }
    [data-theme="light"] .theme-toggle .icon-moon { display: inline-flex; }

    /* ---------- Header ---------- */
    .head {
      text-align: center;
      padding: 28px 0 8px;
      animation: rise .7s cubic-bezier(.2, .7, .2, 1) both;
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(16px);
      }
    }

    .eyebrow {
      font-size: .76rem;
      font-weight: 600;
      letter-spacing: .15em;
      text-transform: uppercase;
      color: var(--accent-ink);
      margin-bottom: 10px;
    }

    h1 {
      font-family: 'Fraunces', Georgia, serif;
      font-weight: 500;
      font-size: clamp(2.1rem, 5vw, 3rem);
      line-height: 1.1;
      letter-spacing: -.01em;
      color: var(--ink);
    }

    .divider {
      width: 42px;
      height: 3px;
      border-radius: 3px;
      background: var(--accent);
      margin: 20px auto;
    }

    .subtitle {
      font-size: 1.02rem;
      color: var(--text);
      max-width: 48ch;
      margin: 0 auto;
    }

    .count {
      display: inline-block;
      margin-top: 18px;
      font-size: .82rem;
      font-weight: 600;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: var(--muted);
    }

    /* ---------- Galería ---------- */
    .gallery {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      padding: 40px 0 24px;
    }

    @media (max-width: 860px) {
      .gallery {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 560px) {
      .gallery {
        grid-template-columns: 1fr;
      }
    }

    .shot {
      display: flex;
      flex-direction: column;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow);
      transition: transform .2s ease, box-shadow .2s ease, border-color .3s ease, background-color .3s ease;
    }

    .shot:hover {
      transform: translateY(-4px);
      box-shadow: 0 1px 2px rgba(23, 24, 27, .05), 0 24px 60px rgba(23, 24, 27, .10);
    }

    .shot img {
      display: block;
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      background: var(--bg);
    }

    .shot .caption {
      padding: 16px 18px 18px;
    }

    .shot .caption h3 {
      font-family: 'Fraunces', Georgia, serif;
      font-weight: 500;
      font-size: 1.14rem;
      line-height: 1.2;
      color: var(--ink);
      margin-bottom: 4px;
    }

    .shot .caption p {
      font-size: .9rem;
      color: var(--muted);
    }

    /* Estado vacío mientras no hay imágenes subidas. */
    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 64px 24px 80px;
      color: var(--muted);
    }

    .empty-state svg {
      width: 48px;
      height: 48px;
      color: var(--line);
      margin-bottom: 18px;
    }

    .empty-state p {
      max-width: 40ch;
      margin: 0 auto;
      font-size: .98rem;
    }

    /* ---------- Footer ---------- */
    footer {
      text-align: center;
      padding: 24px 0 40px;
      font-size: .82rem;
      color: var(--muted);
    }

    @media (prefers-reduced-motion: reduce) {
      .head {
        animation: none;
      }
    }
  </style>
</head>

<body>

  <div class="wrap">

    <!-- ============ TOP BAR ============ -->
    <div class="topbar">
      <a href="index.html" class="back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M19 12H5" />
          <path d="m12 19-7-7 7-7" />
        </svg>
        Volver
      </a>
      <div class="topbar-actions">
        <button class="theme-toggle" type="button" aria-label="Cambiar a modo claro" aria-pressed="true">
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
        </button>
        <a href="index.html" class="brand">JS<span>.</span></a>
      </div>
    </div>

    <!-- ============ HEADER ============ -->
    <header class="head">
      <p class="eyebrow">Diseño de circuitos</p>
      <h1>Galería ASIC</h1>
      <div class="divider"></div>
      <p class="subtitle">
        Imágenes de mis diseños de circuitos integrados:<br>
        layouts, floorplans y capturas que iré subiendo.
      </p>
    </header>

    <!-- ============ GALERÍA ============ -->
    <!--
      Para añadir una imagen, copia un bloque <figure class="shot"> ... </figure>
      y edita la ruta de la imagen (assets/img/asics/…), el título y la descripción.
      Formato recomendado: .webp o .avif; proporción 4:3 para que encajen en la rejilla.
      Cuando añadas la primera imagen, borra el bloque <div class="empty-state">.

      <figure class="shot">
        <img src="assets/img/asics/mi-chip.webp" alt="Descripción del ASIC" loading="lazy">
        <figcaption class="caption">
          <h3>Nombre del chip</h3>
          <p>Nodo / proyecto / año</p>
        </figcaption>
      </figure>
    -->
    <main class="gallery">

      <div class="empty-state">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="3" width="18" height="18" rx="2.5" />
          <circle cx="8.5" cy="8.5" r="1.5" />
          <path d="m21 15-5-5L5 21" />
        </svg>
        <p>Todavía no hay imágenes. Iré subiendo aquí las capturas de mis diseños ASIC.</p>
      </div>

    </main>

    <footer>© 2026 · jossigizq</footer>
  </div>

  <!-- Trazas de enrutado animadas sobre la cuadrícula del fondo. -->
  <script src="assets/js/grid-routes.js" defer></script>

  <script>
    // Botón de modo oscuro/claro: alterna el tema, lo recuerda y avisa a lectores de pantalla.
    (function () {
      var btn = document.querySelector('.theme-toggle');
      if (!btn) return;
      var root = document.documentElement;
      var meta = document.querySelector('meta[name="theme-color"]');

      function apply(dark) {
        if (dark) root.removeAttribute('data-theme');
        else root.setAttribute('data-theme', 'light');
        btn.setAttribute('aria-pressed', dark ? 'true' : 'false');
        btn.setAttribute('aria-label', dark ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro');
        if (meta) meta.setAttribute('content', dark ? '#16171B' : '#FBFAF7');
      }

      apply(root.getAttribute('data-theme') !== 'light');

      btn.addEventListener('click', function () {
        var dark = root.getAttribute('data-theme') === 'light';
        apply(dark);
        try { localStorage.setItem('theme', dark ? 'dark' : 'light'); } catch (e) {}
      });
    })();
  </script>

</body>

</html>
