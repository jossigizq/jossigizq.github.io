<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>José María Sigüenza Izquierdo</title>
  <meta name="description"
    content="Ingeniero de Computadores. Diseño de circuitos digitales (ASIC y FPGA) y verificación.">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/x-icon" href="favicon.ico" sizes="32x32">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
  <meta name="theme-color" content="#16171B">

  <script>
    // Fija el tema (oscuro/claro) antes de pintar, para que no haya parpadeo. Por defecto, oscuro.
    (function () {
      try {
        var saved = localStorage.getItem('theme');
        // Por defecto, oscuro: solo marcamos 'light' si el usuario lo eligió.
        if (saved === 'light') document.documentElement.setAttribute('data-theme', 'light');
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', saved === 'light' ? '#FBFAF7' : '#16171B');
      } catch (e) {}
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet">

  <style>
    /* El modo oscuro es el de por defecto (también sin JS). */
    :root {
      --bg: #16171B;
      --surface: #1F2127;
      --ink: #F2EFE8;
      --text: #C2C5CC;
      --muted: #868B95;
      --line: #2C2F37;
      --accent: #C8A26C;
      --accent-ink: #D8B888;
      --on-ink: #16171B;
      --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 18px 50px rgba(0, 0, 0, .5);
    }

    /* Modo claro: opcional, se activa con data-theme="light". */
    [data-theme="light"] {
      --bg: #FBFAF7;
      --surface: #FFFFFF;
      --ink: #17181B;
      --text: #4A4D54;
      --muted: #9A9EA6;
      --line: #ECE8DF;
      --accent: #B08D57;
      --accent-ink: #8A6D3F;
      --on-ink: #fff;
      --shadow: 0 1px 2px rgba(23, 24, 27, .04), 0 18px 50px rgba(23, 24, 27, .07);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      /* Textura sutil de puntos */
      background-image: radial-gradient(var(--line) 1px, transparent 1px);
      background-size: 26px 26px;
      transition: background-color .3s ease, color .3s ease;
    }

    .card {
      background: var(--surface);
      width: 100%;
      max-width: 460px;
      border: 1px solid var(--line);
      border-radius: 24px;
      padding: 48px 40px 36px;
      text-align: center;
      box-shadow: var(--shadow);
      animation: rise .7s cubic-bezier(.2, .7, .2, 1) both;
      transition: background-color .3s ease, border-color .3s ease;
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(16px);
      }
    }

    .avatar {
      width: 116px;
      height: 116px;
      border-radius: 50%;
      object-fit: cover;
      margin: 0 auto 22px;
      display: block;
      border: 3px solid var(--surface);
      box-shadow: 0 0 0 1px var(--line), var(--shadow);
    }

    .eyebrow {
      font-size: .76rem;
      font-weight: 600;
      letter-spacing: .15em;
      text-transform: uppercase;
      color: var(--accent-ink);
      margin-bottom: 10px;
    }

    h1 {
      font-family: 'Fraunces', Georgia, serif;
      font-weight: 500;
      font-size: 2.05rem;
      line-height: 1.1;
      letter-spacing: -.01em;
      color: var(--ink);
    }

    .divider {
      width: 42px;
      height: 3px;
      border-radius: 3px;
      background: var(--accent);
      margin: 20px auto;
    }

    .roles {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin: 0 auto 18px;
    }

    .role {
      font-size: .8rem;
      font-weight: 500;
      padding: 6px 14px;
      border-radius: 999px;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--line);
    }

    .bio {
      font-size: 1.02rem;
      color: var(--text);
      max-width: 36ch;
      margin: 0 auto;
    }

    .cv {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin: 30px 0 8px;
      padding: 13px 28px;
      background: var(--ink);
      color: var(--on-ink);
      border-radius: 999px;
      font-size: .96rem;
      font-weight: 600;
      text-decoration: none;
      transition: transform .18s ease, opacity .18s ease;
    }

    .cv:hover {
      transform: translateY(-2px);
      opacity: .92;
    }

    .cv svg {
      width: 17px;
      height: 17px;
    }

    .socials {
      display: flex;
      justify-content: center;
      gap: 14px;
      margin-top: 28px;
      padding-top: 28px;
      border-top: 1px solid var(--line);
    }

    .social {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      border: 1px solid var(--line);
      color: var(--ink);
      text-decoration: none;
      transition: transform .18s ease, background .18s ease, color .18s ease, border-color .18s ease;
    }

    .social:hover {
      transform: translateY(-3px);
      background: var(--ink);
      color: var(--on-ink);
      border-color: var(--ink);
    }

    .social svg {
      width: 20px;
      height: 20px;
    }

    /* Botón de modo oscuro/claro, fijo en la esquina superior derecha. */
    .theme-toggle {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 10;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      border: 1px solid var(--line);
      background: var(--surface);
      box-shadow: var(--shadow);
      color: var(--ink);
      cursor: pointer;
      transition: transform .18s ease, border-color .18s ease, background-color .3s ease, color .3s ease;
    }

    .theme-toggle:hover {
      transform: translateY(-2px);
      border-color: var(--ink);
    }

    .theme-toggle svg {
      width: 20px;
      height: 20px;
    }

    .theme-toggle .icon-moon { display: none; }
    [data-theme="light"] .theme-toggle .icon-sun { display: none; }
    [data-theme="light"] .theme-toggle .icon-moon { display: inline-flex; }

    footer {
      margin-top: 26px;
      font-size: .82rem;
      color: var(--muted);
    }

    @media (prefers-reduced-motion: reduce) {
      .card {
        animation: none;
      }
    }
  </style>
</head>

<body>

  <button class="theme-toggle" type="button" aria-label="Cambiar a modo claro" aria-pressed="true">
    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
  </button>

  <main class="card">
    <img class="avatar" src="avatar-monogram.svg" alt="Retrato de José María Sigüenza Izquierdo">

    <p class="eyebrow">Ingeniero de Computadores</p>
    <h1>José María<br>Sigüenza Izquierdo</h1>

    <div class="divider"></div>

    <div class="roles">
      <span class="role">Ingeniero de infraestructuras</span>
      <span class="role">Soporte TI</span>
    </div>

    <p class="bio">
      Con un ojo en el diseño y verificación de circuitos digitales. Y otro en las
      redes de computadores.
    </p>

    <a class="cv" href="cv_jossigizq.pdf" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
        <path d="M7 10l5 5 5-5" />
        <path d="M12 15V3" />
      </svg>
      Descargar CV
    </a>

    <nav class="socials">
      <a class="social" href="https://github.com/jossigizq" target="_blank" rel="noopener"
        aria-label="GitHub">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path
            d="M12 .5C5.73.5.5 5.73.5 12.02c0 5.1 3.29 9.42 7.86 10.95.58.11.79-.25.79-.56 0-.27-.01-1.16-.02-2.1-3.2.7-3.88-1.37-3.88-1.37-.52-1.33-1.28-1.69-1.28-1.69-1.05-.72.08-.71.08-.71 1.16.08 1.77 1.19 1.77 1.19 1.03 1.77 2.7 1.26 3.36.96.1-.75.4-1.26.73-1.55-2.55-.29-5.24-1.28-5.24-5.69 0-1.26.45-2.29 1.19-3.1-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.18 1.18a11 11 0 0 1 5.79 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.59.23 2.76.11 3.05.74.81 1.19 1.84 1.19 3.1 0 4.42-2.69 5.39-5.25 5.68.41.36.78 1.07.78 2.16 0 1.56-.01 2.82-.01 3.2 0 .31.21.68.8.56A11.52 11.52 0 0 0 23.5 12.02C23.5 5.73 18.27.5 12 .5Z" />
        </svg>
      </a>
      <a class="social"
        href="https://www.linkedin.com/in/jos%C3%A9-mar%C3%ADa-sig%C3%BCenza-izquierdo-6b55ab35a/"
        target="_blank" rel="noopener" aria-label="LinkedIn">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path
            d="M20.45 20.45h-3.56v-5.57c0-1.33-.02-3.04-1.85-3.04-1.85 0-2.14 1.45-2.14 2.94v5.67H9.35V9h3.42v1.56h.05c.48-.9 1.64-1.85 3.37-1.85 3.6 0 4.27 2.37 4.27 5.46v6.28ZM5.34 7.43a2.07 2.07 0 1 1 0-4.14 2.07 2.07 0 0 1 0 4.14ZM7.12 20.45H3.56V9h3.56v11.45ZM22.22 0H1.77C.79 0 0 .77 0 1.73v20.54C0 23.23.79 24 1.77 24h20.45c.98 0 1.78-.77 1.78-1.73V1.73C24 .77 23.2 0 22.22 0Z" />
        </svg>
      </a>
      <a class="social" href="mailto:jossigizq@hotmail.com" aria-label="Email">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="2" y="4" width="20" height="16" rx="2.5" />
          <path d="m3 6 9 7 9-7" />
        </svg>
      </a>
      <a class="social" href="libros.html" aria-label="Libros que recomiendo"
        title="Libros que recomiendo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" />
          <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z" />
        </svg>
      </a>
    </nav>

    <footer>© 2026 · jossigizq</footer>
  </main>

  <script>
    // Botón de modo oscuro/claro: alterna el tema, lo recuerda y avisa a lectores de pantalla.
    (function () {
      var btn = document.querySelector('.theme-toggle');
      if (!btn) return;
      var root = document.documentElement;
      var meta = document.querySelector('meta[name="theme-color"]');

      function apply(dark) {
        if (dark) root.removeAttribute('data-theme');
        else root.setAttribute('data-theme', 'light');
        btn.setAttribute('aria-pressed', dark ? 'true' : 'false');
        btn.setAttribute('aria-label', dark ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro');
        if (meta) meta.setAttribute('content', dark ? '#16171B' : '#FBFAF7');
      }

      // El tema inicial ya lo fijó el script de la cabecera; aquí solo sincronizo el botón.
      apply(root.getAttribute('data-theme') !== 'light');

      btn.addEventListener('click', function () {
        var dark = root.getAttribute('data-theme') === 'light';
        apply(dark);
        try { localStorage.setItem('theme', dark ? 'dark' : 'light'); } catch (e) {}
      });
    })();
  </script>

</body>

</html>
