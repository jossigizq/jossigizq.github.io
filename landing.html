<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>José María Sigüenza Izquierdo</title>
  <meta name="description"
    content="Ingeniero de Computadores. Diseño de circuitos digitales (ASIC y FPGA) y verificación.">
  <link rel="icon" href="favicon_io/favicon.ico" type="image/x-icon">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet">

  <style>
    :root {
      --bg: #FBFAF7;
      --surface: #FFFFFF;
      --ink: #17181B;
      --text: #4A4D54;
      --muted: #9A9EA6;
      --line: #ECE8DF;
      --accent: #B08D57;
      --accent-ink: #8A6D3F;
      --shadow: 0 1px 2px rgba(23, 24, 27, .04), 0 18px 50px rgba(23, 24, 27, .07);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      /* Textura sutil de puntos */
      background-image: radial-gradient(var(--line) 1px, transparent 1px);
      background-size: 26px 26px;
    }

    .card {
      background: var(--surface);
      width: 100%;
      max-width: 460px;
      border: 1px solid var(--line);
      border-radius: 24px;
      padding: 48px 40px 36px;
      text-align: center;
      box-shadow: var(--shadow);
      animation: rise .7s cubic-bezier(.2, .7, .2, 1) both;
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(16px);
      }
    }

    .avatar {
      width: 116px;
      height: 116px;
      border-radius: 50%;
      object-fit: cover;
      margin: 0 auto 22px;
      display: block;
      border: 3px solid var(--surface);
      box-shadow: 0 0 0 1px var(--line), var(--shadow);
    }

    .eyebrow {
      font-size: .76rem;
      font-weight: 600;
      letter-spacing: .15em;
      text-transform: uppercase;
      color: var(--accent-ink);
      margin-bottom: 10px;
    }

    h1 {
      font-family: 'Fraunces', Georgia, serif;
      font-weight: 500;
      font-size: 2.05rem;
      line-height: 1.1;
      letter-spacing: -.01em;
      color: var(--ink);
    }

    .divider {
      width: 42px;
      height: 3px;
      border-radius: 3px;
      background: var(--accent);
      margin: 20px auto;
    }

    .bio {
      font-size: 1.02rem;
      color: var(--text);
      max-width: 36ch;
      margin: 0 auto;
    }

    .cv {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin: 30px 0 8px;
      padding: 13px 28px;
      background: var(--ink);
      color: #fff;
      border-radius: 999px;
      font-size: .96rem;
      font-weight: 600;
      text-decoration: none;
      transition: transform .18s ease, opacity .18s ease;
    }

    .cv:hover {
      transform: translateY(-2px);
      opacity: .92;
    }

    .cv svg {
      width: 17px;
      height: 17px;
    }

    .socials {
      display: flex;
      justify-content: center;
      gap: 14px;
      margin-top: 28px;
      padding-top: 28px;
      border-top: 1px solid var(--line);
    }

    .social {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      border: 1px solid var(--line);
      color: var(--ink);
      text-decoration: none;
      transition: transform .18s ease, background .18s ease, color .18s ease, border-color .18s ease;
    }

    .social:hover {
      transform: translateY(-3px);
      background: var(--ink);
      color: #fff;
      border-color: var(--ink);
    }

    .social svg {
      width: 20px;
      height: 20px;
    }

    footer {
      margin-top: 26px;
      font-size: .82rem;
      color: var(--muted);
    }

    @media (prefers-reduced-motion: reduce) {
      .card {
        animation: none;
      }
    }
  </style>
</head>

<body>

  <main class="card">
    <img class="avatar" src="avatar-monogram.svg" alt="Retrato de José María Sigüenza Izquierdo">

    <p class="eyebrow">Ingeniero de Computadores</p>
    <h1>José María<br>Sigüenza Izquierdo</h1>

    <div class="divider"></div>

</body>
